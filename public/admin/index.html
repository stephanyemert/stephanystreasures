<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager — Stephany's Treasures</title>
    <!-- Netlify Identity widget: handles login against Git Gateway -->
    <script is:inline src="/scripts/netlify-identity-widget.js"></script>
  </head>
  <body>
    <!-- Decap CMS, loaded from the already-whitelisted jsdelivr CDN -->
    <script src="https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", (user) => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
  </body>
</html>
