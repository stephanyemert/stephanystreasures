# Enable if maintenance mode.
# [[redirects]]
#   from = "/*"
#   to = "https://other.atproducts.xyz/maintenance/"
#   status = 307
#   force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'none'; connect-src 'self' https://cdn.jsdelivr.net https://identity.netlify.com; frame-src 'self' https://app.netlify.com/ https://codepen.io; form-action 'self'; base-uri 'self'; manifest-src 'self'; font-src 'self' data: https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com; object-src 'self'; script-src 'unsafe-inline' 'unsafe-eval' 'self' https://identity.netlify.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://identity.netlify.com; style-src 'unsafe-hashes' 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' blob: data:; frame-ancestors 'self'"
    Permissions-Policy = "fullscreen=(self), geolocation=(), camera=(), browsing-topics=(), picture-in-picture=(self), payment=(), autoplay=(self), encrypted-media=(self), interest-cohort=()"
    Referrer-Policy = "strict-origin"
    X-UA-Compatible = "IE=edge"

# Mirrors public/data/products.json into Stripe's Product catalog after every
# successful deploy — so editing a product in the CMS (which commits to git and
# triggers this deploy) keeps Stripe's catalog in sync automatically.
[[plugins]]
  package = "./plugins/stripe-sync"
